<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OSC Performance — Gestão de Oficina</title>
    <style>
      /* Prevent iOS auto-zoom on input focus */
      input, textarea, select { font-size: 16px !important; }

      html, body {
        margin: 0; padding: 0;
        background: #0a0a0a;
      }
      /* PWA app mode: lock scroll to inner containers */
      body.osc-app {
        height: 100%; overflow: hidden;
      }
      body.osc-app #root {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      /* Public link mode: normal scroll */
      body.osc-public {
        min-height: 100%;
        overflow: auto;
      }
      ::-webkit-scrollbar { display: none; }
    </style>

    <script>
      // Set body class based on URL — public links get normal scroll
      (function() {
        var params = new URLSearchParams(window.location.search);
        var isPublic = params.has('vh') || params.get('portal') === 'cliente' || params.get('portal') === 'mecanico';
        document.body.classList.add(isPublic ? 'osc-public' : 'osc-app');
      })();

      // iOS PWA: set height from window.innerHeight, ignore shrinks from keyboard/autofill
      var _iosH = null;
      function applyHeight(h) {
        _iosH = h;
        var root = document.getElementById('root');
        if (root) root.style.height = h + 'px';
        document.documentElement.style.height = h + 'px';
        document.body.style.height = h + 'px';
      }
      function snapHeight() {
        if (!document.body.classList.contains('osc-app')) return;
        // Take the max between current and stored — iOS sometimes starts low after reload
        var h = window.innerHeight;
        var stored = parseInt(sessionStorage.getItem('_iosH') || '0');
        var best = Math.max(h, stored);
        if (best > 100) {
          sessionStorage.setItem('_iosH', best);
          applyHeight(best);
        }
      }
      // Run immediately and after iOS settles
      snapHeight();
      setTimeout(snapHeight, 100);
      setTimeout(snapHeight, 500);
      // On resize: only grow, never shrink
      window.addEventListener('resize', function() {
        var h = window.innerHeight;
        if (!_iosH || h > _iosH) applyHeight(h);
      });
    </script>
    <!-- PWA -->
    <meta name="application-name" content="OSC Performance" />
    <meta name="apple-mobile-web-app-title" content="OSC Performance" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0a" id="theme-color-meta" />

    <!-- Ícones — PNG obrigatório para iOS Safari -->
    <link rel="apple-touch-icon" sizes="180x180" href="/osc-icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/osc-icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/osc-icon.svg" />
  </head>
  <body style="margin:0;background:#0a0a0a;" id="osc-body">
    <div id="root"></div>
    <script>
      // Apply saved theme immediately to avoid flash
      try {
        const pref = localStorage.getItem("osc_theme") || "auto";
        const t = pref === "auto"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : pref;
        const bg = t === "light" ? "#f0f2f5" : "#0a0a0a";
        document.getElementById("osc-body").style.background = bg;
        document.getElementById("theme-color-meta").setAttribute("content", bg);
      } catch(e) {}
      // Pre-register service worker
      if("serviceWorker" in navigator){
        navigator.serviceWorker.register("/sw.js",{scope:"/"}).then(reg=>{
          // When SW activates after SKIP_WAITING, reload
          navigator.serviceWorker.addEventListener("controllerchange",()=>{
            if(!window.__oscReloading){ window.__oscReloading=true; window.location.reload(); }
          });
          // SW already calls skipWaiting automatically — no manual banner needed here
          // The version.json poll below handles the update banner
        }).catch(()=>{});
      }

      // Version check — two strategies for reliability
      (function(){
        const CURRENT = "2026.09.29.20";
        const stored = localStorage.getItem("osc_deployed_version");

        function showBanner(){
          if(window.__oscUpdatePending) return;
          if(localStorage.getItem("osc_update_clicked")==="1") return;
          window.__oscUpdatePending = true;
          // Mark as seen immediately so reload doesn't re-trigger
          localStorage.setItem("osc_deployed_version", CURRENT);
          function render(){
            const overlay = document.createElement("div");
            overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:99999;padding:24px;font-family:-apple-system,'Inter',sans-serif";
            overlay.innerHTML = `
              <div style="background:#1a1a24;border-radius:24px;border:1px solid rgba(255,107,0,.3);padding:32px 28px;max-width:320px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.6)">
                <div style="width:64px;height:64px;border-radius:18px;background:rgba(255,107,0,.15);border:1px solid rgba(255,107,0,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 20px">
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ff6b00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                </div>
                <div style="font-weight:900;font-size:18px;color:#f0f0f8;margin-bottom:8px;letter-spacing:-.3px">Nova versão disponível</div>
                <div style="font-size:13px;color:#9999bb;margin-bottom:28px;line-height:1.5">O sistema foi atualizado. Recarregue para continuar usando a versão mais recente.</div>
                <button onclick="localStorage.setItem('osc_update_clicked','1');window.location.reload();" style="width:100%;padding:14px 0;border-radius:14px;background:#ff6b00;border:none;color:#fff;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                  Atualizar agora
                </button>
              </div>
            `;
            document.body.appendChild(overlay);
          }
          if(document.body) render(); else window.addEventListener("DOMContentLoaded", render);
        }

        // Strategy 1: HTML-embedded check (works when HTML is fresh)
        localStorage.removeItem("osc_update_clicked");
        if(stored && stored !== CURRENT){
          localStorage.setItem("osc_deployed_version", CURRENT);
          showBanner();
        } else {
          localStorage.setItem("osc_deployed_version", CURRENT);
        }

        // Strategy 2: Poll version.json (works on iOS PWA where HTML is cached)
        function pollVersion(){
          if(window.__oscUpdatePending) return;
          fetch("/version.json?t="+Date.now(), {cache:"no-store"})
            .then(r=>r.json())
            .then(data=>{
              const s = localStorage.getItem("osc_deployed_version");
              if(s && s !== data.version){
                localStorage.setItem("osc_deployed_version", data.version);
                showBanner();
              } else {
                localStorage.setItem("osc_deployed_version", data.version);
              }
            }).catch(()=>{});
        }
        // Run immediately and every 30s
        setTimeout(pollVersion, 3000);
        setInterval(pollVersion, 30000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
