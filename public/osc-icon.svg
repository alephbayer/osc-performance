<svg width="1024" height="1024" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>OSC Performance app icon</title>
  <desc>Ícone do webapp OSC Performance</desc>

  <defs>
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2a1200"/>
      <stop offset="60%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9944"/>
      <stop offset="50%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#cc4400"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="30%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect x="60" y="60" width="560" height="560" rx="130"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="60" y="60" width="560" height="560" rx="130" fill="url(#bgGrad)"/>

  <!-- Subtle orange glow behind icon -->
  <ellipse cx="310" cy="300" rx="220" ry="200" fill="url(#glowGrad)" clip-path="url(#iconClip)"/>

  <!-- Speed lines / motion arcs (decorative) -->
  <g clip-path="url(#iconClip)" opacity="0.12">
    <path d="M 80 520 Q 340 200 600 380" stroke="#ff6b00" stroke-width="1.5" fill="none"/>
    <path d="M 80 470 Q 340 170 600 330" stroke="#ff6b00" stroke-width="1" fill="none"/>
    <path d="M 80 570 Q 340 250 600 430" stroke="#ff6b00" stroke-width="1" fill="none"/>
  </g>

  <!-- Wrench body -->
  <g clip-path="url(#iconClip)">
    <rect x="278" y="195" width="60" height="310" rx="12" fill="url(#wrenchGrad)" transform="rotate(-38 340 340)"/>
    <rect x="255" y="148" width="106" height="106" rx="22" fill="url(#wrenchGrad)" transform="rotate(-38 340 340)"/>
    <rect x="279" y="172" width="58" height="58" rx="10" fill="#0f0600" transform="rotate(-38 340 340)"/>
    <rect x="255" y="387" width="44" height="80" rx="10" fill="url(#wrenchGrad)" transform="rotate(-38 340 340)"/>
    <rect x="317" y="387" width="44" height="80" rx="10" fill="url(#wrenchGrad)" transform="rotate(-38 340 340)"/>
  </g>

  <!-- OSC text -->
  <text x="340" y="575" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="52" letter-spacing="10" fill="#ff6b00">OSC</text>

  <!-- Shine overlay (liquid glass effect) -->
  <rect x="60" y="60" width="560" height="280" rx="130" fill="url(#shineGrad)" clip-path="url(#iconClip)"/>

  <!-- Border ring -->
  <rect x="60" y="60" width="560" height="560" rx="130" fill="none" stroke="#ff6b00" stroke-width="2" stroke-opacity="0.35"/>
</svg>
